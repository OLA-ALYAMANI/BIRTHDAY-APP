<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Css/birthday.css">
    <title>الميلاد التالي</title>
</head>
<body>
    <!-- MESSAGE AREA -->
    <section class="message-area">
        
        <div class="subtitle">
            العد التنازلي حتى عيد ميلادك القادم:
        </div>
        <div class="countdown">
            <div class="unit">
                <div class="number" id="days">
                     0
                </div>
                <div class="label">
                     أيام
                </div>
            </div>
            <div class="unit">
                <div class="number" id="hours">
                    0
                </div>
                <div class="label">
                    ساعات
                </div>
            </div>
            <div class="unit">
                <div class="number" id="minutes">
                    0
                </div>
                <div class="label">
                    دقائق
                </div>
            </div>
            <div class="unit">
                <div class="number" id="seconds">
                    0
                </div>
                <div class="label">
                    ثواني
                </div>
            </div>
        </div>
        <div class="btn">
            <button id="beforetBtn" onclick="goBirthday()">السابق</button>
        </div>
    </section>
</body>
<script src="./Js/birthday.js"></script>
</html>
